name: Contribution snake

# Redraws the contribution-graph snake shown in README.md and publishes it to the `output` branch,
# so master doesn't collect a bot commit every day.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draw the snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Dot colours run from no contributions to the most, in the README's purple; the snake is orange.
          outputs: |
            dist/snake.svg?color_snake=#f97316&color_dots=#ebedf0,#e9d5ff,#c084fc,#9333ea,#6b21a8
            dist/snake-dark.svg?color_snake=#f97316&color_dots=#161b22,#2e1065,#5b21b6,#7c3aed,#a855f7

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
